name: Validate project
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python run_all.py --all
      # Part 3 tests compare all 13 committed CSVs with numerical tolerance.
      # Its image rendering and solver metadata may vary across platforms.
      - run: git diff --exit-code -- . ':!outputs/**/*.png' ':!outputs/part_3/**'
